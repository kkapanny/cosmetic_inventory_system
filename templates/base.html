{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cosmetic Inventory System{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="icon" href="{% static 'img/logo.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body class="app-body d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable" href="#main-content">
        Перейти к содержимому
    </a>
    {% include "includes/navigation.html" %}
    <main id="main-content" class="app-main container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="app-footer border-top py-3">
        <div class="container text-secondary small">
            <span data-current-year>2026</span> Cosmetic Inventory System
        </div>
    </footer>
</body>
</html>
