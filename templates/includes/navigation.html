{% load static %}
<nav class="app-navbar navbar border-bottom" aria-label="Основная навигация">
    <div class="container d-flex flex-wrap gap-2">
        <a class="navbar-brand me-auto" href="{% url 'homepage:index' %}">
            <img
                class="brand-mark"
                src="{% static 'img/logo.svg' %}"
                width="36"
                height="36"
                alt=""
            >
            <span>Cosmetic Inventory</span>
        </a>
        <ul class="navbar-nav flex-row flex-wrap gap-2">
            <li class="nav-item">
                <a
                    class="nav-link px-2{% if request.resolver_match.namespace == 'homepage' %} active{% endif %}"
                    href="{% url 'homepage:index' %}"
                    {% if request.resolver_match.namespace == 'homepage' %}aria-current="page"{% endif %}
                >
                    Главная
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link px-2{% if request.resolver_match.url_name == 'list' or request.resolver_match.url_name == 'detail' %} active{% endif %}"
                    href="{% url 'products:list' %}"
                    {% if request.resolver_match.url_name == 'list' or request.resolver_match.url_name == 'detail' %}aria-current="page"{% endif %}
                >
                    Средства
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link px-2{% if request.resolver_match.url_name == 'attention' %} active{% endif %}"
                    href="{% url 'products:attention' %}"
                    {% if request.resolver_match.url_name == 'attention' %}aria-current="page"{% endif %}
                >
                    Требуют внимания
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link px-2{% if request.resolver_match.url_name == 'statistics' %} active{% endif %}"
                    href="{% url 'products:statistics' %}"
                    {% if request.resolver_match.url_name == 'statistics' %}aria-current="page"{% endif %}
                >
                    Статистика
                </a>
            </li>
        </ul>
    </div>
</nav>
